name: Project checks

on:
  push:
    branches: [main, codex/game-modes, prototype/skating-puck-lab]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 tag; Node 24
        with:
          persist-credentials: false
      - name: Install verified Godot 4.6.3
        run: |
          bash tools/ci/install_godot.sh
          echo "$PWD/build/tools/bin" >> "$GITHUB_PATH"
      - name: Run engine and Python checks
        run: python3 tools/check_project.py --suite all --workers 2
      - name: Preserve check reports and logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0; Node 24
        with:
          name: project-checks-${{ github.sha }}
          path: |
            build/checks/*.json
            build/checks/*.xml
            build/checks/*.log
          if-no-files-found: warn
          retention-days: 14
